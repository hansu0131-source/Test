<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C9 토끼 숙제 & 낭플단 관리 🐰</title>
<style>
  /* --- 🍓 딸기우유 테마 --- */
  :root {
    --bg-color: #fff5f8; 
    --container-bg: #ffffff;
    --primary-pink: #ffcdd2; 
    --dark-pink: #f06292; 
    --light-pink-hover: #ffe4e9; 
    --border-pink: #ffe0e6; 
    --text-gray: #777;
    --text-dark: #333; 
    --accent-blue: #b2ebf2; 
    --radius-soft: 15px;
    --radius-round: 25px;
    --shadow-soft: 0 8px 25px rgba(240, 98, 146, 0.15);

    /* 기록실 전용 색상 */
    --strawberry-milk-bg: #ffeef4;
    --deep-pink-text: #e91e63;
    
    /* 금액별 배경색 (기록실용) */
    --lv0: #FFFFFF; --lv1: #FFF5F8; --lv2: #FFF0F5; --lv3: #FFEBF2; --lv4: #FFE0EB;
    --lv5: #FFD9E4; --lv6: #FFC9D9; --lv7: #FFB6CB; --lv8: #FFA3BE; --lv9: #FF80A6;
  }

  body { 
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
    background-color: var(--bg-color);
    background-image: radial-gradient(#ffe4e1 1px, transparent 1px);
    background-size: 25px 25px;
    padding: 20px; margin: 0; color: var(--text-dark);
  }
  input, button, textarea, select { font-family: inherit; box-sizing: border-box; outline: none; }
  h2, h3 { color: var(--text-dark); font-weight: 700; }

  /* 메인 탭 */
  .main-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
  .nav-tab {
    padding: 12px 35px; border-radius: 35px; font-weight: bold; font-size: 16px;
    background: white; border: 3px solid var(--border-pink); color: var(--text-gray);
    cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(255, 182, 193, 0.2);
  }
  .nav-tab:hover { transform: translateY(-3px); background: var(--light-pink-hover); border-color: var(--primary-pink); }
  .nav-tab.active { background: var(--dark-pink); color: white; border-color: var(--dark-pink); box-shadow: 0 6px 15px rgba(240, 98, 146, 0.3); }

  .page-section { display: none; animation: fadeIn 0.4s ease-out; }
  .page-section.active { display: block; }

  /* 레이아웃 */
  .wrapper { display: flex; gap: 25px; max-width: 1650px; margin: 0 auto; align-items: flex-start; }
  .sidebar, .sidebar-right { 
    width: 280px; background: var(--container-bg); padding: 30px; border-radius: var(--radius-round); 
    box-shadow: var(--shadow-soft); flex-shrink: 0; max-height: 850px; overflow-y: auto; border: 3px solid #fff; 
  }
  .container { 
    flex: 1; background: var(--container-bg); padding: 40px; border-radius: var(--radius-round); 
    box-shadow: var(--shadow-soft); border: 3px solid #fff; position: relative; 
  }

  /* 캘린더 스타일 */
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 30px;}
  .day-name { text-align: center; font-size: 1rem; color: var(--dark-pink); font-weight: bold; padding-bottom: 15px; }
  .day-cell { 
    height: 75px; background: #fff; border: 2px solid var(--border-pink); border-radius: var(--radius-soft); 
    position: relative; cursor: pointer; transition: all 0.3s ease; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; 
  }
  .day-cell:hover { border-color: var(--dark-pink); background: var(--light-pink-hover); transform: scale(1.05); z-index: 1; box-shadow: 0 4px 10px rgba(240, 98, 146, 0.1); }
  .day-number { font-size: 15px; font-weight: bold; color: var(--text-gray); }
  .has-homework { background-color: #fff0f3 !important; border: 2px solid var(--primary-pink) !important; }
  .hw-badge { align-self: flex-end; background-color: var(--dark-pink); color: white; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 12px; }

  /* 닉네임 버튼 상태별 색상 */
  .nick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; margin-bottom: 30px; }
  .nick-btn { 
    background: #fff; border: 2px solid var(--border-pink); border-radius: var(--radius-soft); padding: 16px 8px; 
    font-size: 14px; font-weight: bold; color: var(--text-gray); cursor: pointer; text-align: center; 
    transition: all 0.2s ease; box-shadow: 0 3px 8px rgba(0,0,0,0.03); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 100%;
  }
  .nick-btn.status-todo { background: #ffebee; color: #d32f2f; border-color: #ffcdd2; }
  .nick-btn.status-bangsel { background: #fff3e0; color: #f57c00; border-color: #ffe0b2; }
  .nick-btn.status-note { background: #fff8e1; color: #fbc02d; border-color: #ffecb3; }
  .nick-btn.status-reversefan { background: #e1f5fe; color: #0288d1; border-color: #b3e5fc; }
  .nick-btn.status-done { background: #e8f5e9; color: #388e3c; border-color: #c8e6c9; }

  /* 상세 창 디자인 */
  #detail-card { display: none; margin-top: 30px; background: #fffafc; border-radius: var(--radius-round); padding: 30px; border: 3px solid var(--border-pink); box-shadow: var(--shadow-soft); }
  .icon-btn.clone { color: #4caf50; border-color: #c8e6c9; } /* 복제 버튼 전용 색상 */
  
  .status-options { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .status-radio { display: none; }
  .status-label { padding: 8px 15px; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: bold; color: #777; background: #eee; transition: all 0.3s; display: flex; align-items: center; gap: 5px; }
  
  input[type="radio"]:checked + .status-label.lbl-todo { background: #ff8a80; color: white; box-shadow: 0 4px 10px rgba(255, 138, 128, 0.3); transform: translateY(-2px); }
  input[type="radio"]:checked + .status-label.lbl-bangsel { background: #ffb74d; color: white; box-shadow: 0 4px 10px rgba(255, 183, 77, 0.3); transform: translateY(-2px); }
  input[type="radio"]:checked + .status-label.lbl-note { background: #ffd54f; color: white; box-shadow: 0 4px 10px rgba(255, 213, 79, 0.3); transform: translateY(-2px); }
  input[type="radio"]:checked + .status-label.lbl-reversefan { background: #4fc3f7; color: white; box-shadow: 0 4px 10px rgba(79, 195, 247, 0.3); transform: translateY(-2px); }
  input[type="radio"]:checked + .status-label.lbl-done { background: #81c784; color: white; box-shadow: 0 4px 10px rgba(129, 199, 132, 0.3); transform: translateY(-2px); }

  .btn-note { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; background-color: #ffd54f; color: #fff; border: none; padding: 16px; border-radius: var(--radius-soft); text-decoration: none; font-weight: bold; font-size: 16px; box-shadow: 0 6px 15px rgba(255, 213, 79, 0.3); margin-bottom: 10px; transition: all 0.2s; }

  /* 기록실 레이아웃 */
  .season-layout { max-width: 1650px; margin: 0 auto; background: var(--container-bg); border-radius: var(--radius-round); padding: 35px; box-shadow: var(--shadow-soft); border: 3px solid #fff; }
  .record-row { display: flex; background: white; border-bottom: 1px solid #eee; padding: 4px 0; transition: all 0.2s ease; align-items: center; }
  .record-cell { padding: 4px 4px; font-size: 17px; text-align: center; border-right: 1px solid rgba(0,0,0,0.05); outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: center; align-items: center; min-height: 28px; color: var(--text-dark); }
  
  /* 랭킹 팝업(모달) */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; animation: fadeIn 0.2s ease-out;}
  .modal-content { background: white; padding: 25px; border-radius: 25px; width: 450px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 4px solid var(--primary-pink); }
  .history-item { padding: 12px; border-bottom: 1px solid #f0f0f0; display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: all 0.2s; }
  .history-item:hover { background-color: #fff5f8; transform: translateX(5px); }

  @media (max-width: 1024px) {
    .wrapper { flex-direction: column; }
    .sidebar, .sidebar-right { width: 100%; max-height: 250px; }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="loading-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; font-weight:800; color:var(--dark-pink); font-size:1.6rem; gap:15px;">
  <div>🐰</div><div>데이터를 불러오는 중...</div>
</div>

<div id="history-modal" class="modal-overlay" onclick="closeHistoryModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px dashed var(--border-pink); padding-bottom:15px;">
      <div class="modal-title" id="history-title" style="font-size:1.2rem; font-weight:800;">숙제 기록</div>
      <button style="background:none; border:2px solid #ddd; border-radius:50%; width:30px; height:30px; cursor:pointer;" onclick="closeHistoryModal()">X</button>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<nav class="main-nav">
  <button id="tab-btn-calendar" class="nav-tab active" onclick="switchPage('calendar')">📅 숙제 캘린더</button>
  <button id="tab-btn-record" class="nav-tab" onclick="switchPage('record')">🍓 낭플단 기록실</button>
</nav>

<div id="page-calendar" class="page-section active">
  <div class="wrapper">
    <div class="sidebar">
      <div class="sidebar-title" style="font-weight:bold; margin-bottom:15px; color:var(--dark-pink);">🐰 날짜별 기록</div>
      <div id="sidebar-list"></div>
    </div>

    <div class="container">
      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전</button>
        <h2 id="current-month" style="margin:0;">2026년 1월</h2>
        <button class="nav-btn" onclick="changeMonth(1)">다음 ▶</button>
      </div>
      <div class="calendar-grid" id="calendar"></div>

      <div id="nickname-view" style="display:none; margin-top:30px; border-top:3px dotted var(--border-pink); padding-top:30px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h3 id="selected-date-text" style="margin:0; font-size:1.4rem;">숙제 대상자</h3>
          <button class="btn-add-show" onclick="toggleAddForm()">+ 숙제 추가</button>
        </div>
        
        <div id="add-form" style="display:none;">
          <div class="form-row"><input type="date" id="new-date" class="form-input"></div>
          <div class="form-row">
            <input type="text" id="new-nick" class="form-input" placeholder="닉네임">
            <input type="text" id="new-id" class="form-input" placeholder="아이디">
          </div>
          <div class="form-row">
            <input type="number" id="new-amount" class="form-input" placeholder="풍선 개수" oninput="autoCalculate()">
            <input type="number" id="new-reverse" class="form-input" placeholder="역팬(자동)" readonly>
          </div>
          <div style="margin-bottom:15px; display:flex; gap:15px; align-items:center;">
             <label style="cursor:pointer; font-weight:bold; color:var(--text-gray);"><input type="radio" name="calc-ratio" value="0.03" checked onchange="autoCalculate()"> 3%</label>
             <label style="cursor:pointer; font-weight:bold; color:var(--text-gray);"><input type="radio" name="calc-ratio" value="0.05" onchange="autoCalculate()"> 5%</label>
             <label style="cursor:pointer; font-weight:bold; color:var(--text-gray);"><input type="radio" name="calc-ratio" value="0.10" onchange="autoCalculate()"> 10%</label>
          </div>
          <input type="text" id="new-content" class="form-input" placeholder="숙제 내용 (직접 입력)" style="margin-bottom:15px;">
          <button class="btn-register" id="btn-submit" onclick="handleTaskSubmit()">등록 완료 💖</button>
        </div>
        
        <div class="nick-list" id="nick-list-container"></div>
      </div>

      <div id="detail-card">
        <div class="card-header">
          <div class="user-info">
            <h3 id="detail-nick">닉네임</h3>
            <span class="user-id" id="detail-id">id_placeholder</span>
          </div>
          <div class="card-actions">
            <button class="icon-btn clone" onclick="cloneCalendarTask()" title="복제">📋</button>
            <button class="icon-btn edit" onclick="openEditForm()" title="수정">✏️</button>
            <button class="icon-btn del" onclick="deleteTask()" title="삭제">🗑</button>
            <button class="icon-btn close" onclick="closeDetail()">X</button>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><span class="stat-label">총 후원</span><span class="stat-value money" id="detail-amount">0</span></div>
          <div class="stat-box"><span class="stat-label">역팬</span><span class="stat-value reverse" id="detail-reverse">0</span></div>
        </div>
        <div class="task-box">
          <span class="task-label">📝 숙제 내용</span>
          <div class="task-content" id="detail-content">내용</div>
          <div class="status-control">
            <div class="status-options">
              <input type="radio" name="status" id="st-todo" value="todo" onchange="saveTaskStatus(false)">
              <label for="st-todo" class="status-label lbl-todo">🔴 대기</label>
              <input type="radio" name="status" id="st-bangsel" value="bangsel" onchange="saveTaskStatus(false)">
              <label for="st-bangsel" class="status-label lbl-bangsel">🟠 방셀</label>
              <input type="radio" name="status" id="st-note" value="note" onchange="saveTaskStatus(false)">
              <label for="st-note" class="status-label lbl-note">🟡 쪽지</label>
              <input type="radio" name="status" id="st-reversefan" value="reversefan" onchange="saveTaskStatus(false)">
              <label for="st-reversefan" class="status-label lbl-reversefan">🔵 역팬</label>
              <input type="radio" name="status" id="st-done" value="done" onchange="saveTaskStatus(false)">
              <label for="st-done" class="status-label lbl-done">🟢 완료</label>
            </div>
            <textarea id="detail-memo" class="memo-input" placeholder="메모를 입력하세요..." onblur="saveTaskStatus(false)"></textarea>
          </div>
        </div>
        <a href="#" target="_blank" class="btn-note" id="detail-note-link">💌 쪽지 보내기</a>
        <a href="#" target="_blank" class="btn-soop" id="detail-link">
          <svg class="soop-icon" viewBox="0 0 24 24"><path d="M21 3H3C1.89543 3 1 3.89543 1 5V17C1 18.1046 1.89543 19 3 19H8V21H16V19H21C22.1046 19 23 18.1046 23 17V5C23 3.89543 22.1046 3 21 3ZM21 17H3V5H21V17Z" /></svg>
          SOOP 방송국 바로가기
        </a>
        <button class="btn-complete" onclick="completeAndDelete()">완료 처리 (삭제)</button>
      </div>
    </div>

    <div class="sidebar-right">
      <div class="sidebar-title" style="font-weight:bold; margin-bottom:15px; color:var(--dark-pink);">🥕 누적 숙제 랭킹</div>
      <div id="total-rank-list"></div>
    </div>
  </div>
</div>

<div id="page-record" class="page-section">
  <div class="season-layout">
    <div class="record-header-area" style="text-align:center; margin-bottom:30px;">
      <h2 id="current-season-title">🍓 낭플단 기록실</h2>
      <div class="notice-text">모든 공약은 요청시에 가고있습니다. 당군+(hansu0131)에게 쪽지 또는 댓글로 편하게 말씀해주세요 ❤</div>
      <div class="search-container"><input type="text" id="record-search" placeholder="아이디 / 닉네임 검색" oninput="filterRecords()"></div>
    </div>
    <div class="season-tabs" id="season-tabs-container"></div>
    <div id="season-content-area" style="display:none;">
      <div class="controls-row">
        <button class="nav-tab" style="font-size:13px; padding:8px 15px;" onclick="createNewSeason()">+ 새 시즌 추가</button>
        <span class="paste-guide">💡 엑셀 복사(Ctrl+C) → 붙여넣기(Ctrl+V)</span>
        <button class="btn-del-season" onclick="deleteCurrentSeason()">이 시즌 삭제</button>
      </div>
      <div class="table-scroll">
        <div class="table" id="record-table-body">
          <div class="record-row header-row">
            <div class="record-cell col-id">아이디</div>
            <div class="record-cell col-nick">닉네임</div>
            <div class="record-cell col-amt">기여도</div>
            <div class="record-cell col-promise">공약</div>
            <div class="record-cell col-reverse">역팬</div>
            <div class="record-cell col-note">비고</div>
            <div class="record-cell col-action"></div>
          </div>
          <div id="record-data-rows"></div>
          <div class="record-row summary-row">
            <div class="record-cell col-id">합계</div>
            <div class="record-cell col-nick" id="sum-count" style="color:var(--deep-pink-text);">0명</div>
            <div class="record-cell col-amt" id="sum-nang" style="font-weight:900; color:var(--deep-pink-text);">0</div>
            <div class="record-cell col-promise"></div>
            <div class="record-cell col-reverse" id="sum-reverse" style="font-weight:900; color:var(--deep-pink-text);">0</div>
            <div class="record-cell col-note"></div>
            <div class="record-cell col-action"></div>
          </div>
        </div>
      </div>
      <div style="text-align:center; margin-top:25px;"><button class="nav-tab" onclick="addEmptyRowAtEnd()" style="padding: 10px 25px;">+ 빈 줄 추가</button></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhduAPQ_9IyEH1rnr9m9qtumgnIF90RII",
    authDomain: "homework-c9.firebaseapp.com",
    databaseURL: "https://homework-c9-default-rtdb.firebaseio.com",
    projectId: "homework-c9",
    storageBucket: "homework-c9.firebasestorage.app",
    messagingSenderId: "293416059203",
    appId: "1:293416059203:web:e962586275e2bd2b356ff6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRefHome = ref(db, 'homework_data');
  const dbRefSeason = ref(db, 'season_data');

  window.homeworkData = {}; 
  window.seasonData = {};
  window.currentSeasonName = null;

  onValue(dbRefHome, (snapshot) => {
    window.homeworkData = snapshot.val() || {};
    refreshCalendarUI();
    document.getElementById('loading-overlay').style.display = 'none';
  });

  onValue(dbRefSeason, (snapshot) => {
    window.seasonData = snapshot.val() || {};
    renderSeasonTabs();
    if(window.currentSeasonName && window.seasonData[window.currentSeasonName]) {
        renderRecordTable(window.currentSeasonName);
    } else {
        const keys = Object.keys(window.seasonData).sort();
        if(keys.length > 0) switchSeasonTab(keys[0]);
    }
  });

  window.saveHomework = () => set(dbRefHome, window.homeworkData);
  window.saveSeason = () => set(dbRefSeason, window.seasonData);

  window.switchPage = (page) => {
    document.querySelectorAll('.page-section').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(e => e.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    const btnId = `tab-btn-${page}`;
    const btn = document.getElementById(btnId);
    if(btn) btn.classList.add('active');
  };

  // --- 캘린더 로직 ---
  window.currentDate = new Date();
  window.selectedDateKey = null;
  window.currentTaskIndex = null;
  window.isEditMode = false;

  function refreshCalendarUI() {
    renderCalendar();
    renderSidebar();
    renderTotalRanking();
    if(window.selectedDateKey) renderNickList(window.homeworkData[window.selectedDateKey] || []);
  }

  window.renderCalendar = () => {
    const year = window.currentDate.getFullYear();
    const month = window.currentDate.getMonth();
    document.getElementById('current-month').innerText = `${year}년 ${month+1}월`;
    const el = document.getElementById('calendar'); el.innerHTML = '';
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month+1, 0).getDate();
    ['일','월','화','수','목','금','토'].forEach(d => el.innerHTML+=`<div class="day-name">${d}</div>`);
    for(let i=0; i<firstDay; i++) el.innerHTML+=`<div></div>`;
    for(let i=1; i<=lastDate; i++) {
        const dKey = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const count = (window.homeworkData[dKey]||[]).length;
        const cls = count>0 ? 'has-homework' : '';
        const badge = count>0 ? `<div class="hw-badge">${count}</div>` : '';
        el.innerHTML += `<div class="day-cell ${cls}" onclick="selectDate('${dKey}')"><span class="day-number">${i}</span>${badge}</div>`;
    }
  };

  window.changeMonth = (step) => { 
    window.currentDate.setDate(1); 
    window.currentDate.setMonth(window.currentDate.getMonth()+step); 
    window.renderCalendar(); 
  };
  
  window.selectDate = (key) => {
    window.selectedDateKey = key;
    document.getElementById('selected-date-text').innerText = `${key} 리스트`;
    renderNickList(window.homeworkData[key]||[]);
    document.getElementById('nickname-view').style.display='block';
    document.getElementById('detail-card').style.display='none';
    document.getElementById('add-form').style.display='none';
  };

  window.renderNickList = (list) => {
    const con = document.getElementById('nick-list-container'); con.innerHTML = '';
    if(!list.length) { con.innerHTML = '<div style="grid-column:span 3; text-align:center; color:#ccc;">없음</div>'; return; }
    list.forEach((task, idx) => {
        const btn = document.createElement('button');
        let st = task.status || 'todo';
        if(st === 'partial') st = 'bangsel';
        btn.className = `nick-btn status-${st}`;
        btn.innerText = task.nick;
        btn.onclick = () => showMemberDetail(task, idx);
        con.appendChild(btn);
    });
  };

  window.renderSidebar = () => {
    const con = document.getElementById('sidebar-list'); con.innerHTML = '';
    Object.keys(window.homeworkData).sort().reverse().forEach(key => {
        if(window.homeworkData[key].length > 0) {
            const div = document.createElement('div');
            div.className = 'shortcut-btn';
            div.innerHTML = `<span class="shortcut-date">${key}</span><span class="shortcut-count">${window.homeworkData[key].length}건</span>`;
            div.onclick = () => { window.currentDate = new Date(key); window.renderCalendar(); window.selectDate(key); };
            con.appendChild(div);
        }
    });
  };

  window.renderTotalRanking = () => {
    const con = document.getElementById('total-rank-list'); con.innerHTML = '';
    const counts = {};
    Object.keys(window.homeworkData).forEach(d => window.homeworkData[d].forEach(t => {
        if(!t.id) return;
        if(!counts[t.id]) counts[t.id] = { nick: t.nick, id: t.id, count: 0 };
        counts[t.id].count++;
    }));
    const sorted = Object.values(counts).sort((a,b) => b.count - a.count);
    if(!sorted.length) { con.innerHTML='<div class="no-data-msg">데이터 없음</div>'; return; }
    sorted.forEach((u, i) => {
        let icon = i===0?'👑 ':i===1?'🥈 ':i===2?'🥉 ': `${i+1}. `;
        const div = document.createElement('div');
        div.className = 'rank-item';
        div.innerHTML = `<div class="rank-info"><span class="rank-nick">${icon}${u.nick}</span><span class="rank-id">(${u.id})</span></div><div class="rank-badge">${u.count}개</div>`;
        div.onclick = () => window.showUserHistory(u.id, u.nick);
        con.appendChild(div);
    });
  };

  window.showUserHistory = (userId, userNick) => {
      const modal = document.getElementById('history-modal');
      const listContainer = document.getElementById('history-list');
      document.getElementById('history-title').innerText = `${userNick}님의 숙제 기록`;
      listContainer.innerHTML = '';
      const history = [];
      Object.keys(window.homeworkData).forEach(date => {
          window.homeworkData[date].forEach(task => {
              if(task.id === userId) history.push({ date: date, content: task.content || '내용 없음' });
          });
      });
      history.sort((a, b) => new Date(b.date) - new Date(a.date));
      history.forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `<span class="history-date">${item.date}</span><span class="history-content">${item.content}</span>`;
          div.onclick = () => window.goToDateFromHistory(item.date);
          listContainer.appendChild(div);
      });
      modal.style.display = 'flex';
  };

  window.goToDateFromHistory = (dateKey) => {
      window.closeHistoryModal();
      const [y, m, d] = dateKey.split('-').map(Number);
      window.currentDate = new Date(y, m - 1, 1);
      window.renderCalendar();
      window.selectDate(dateKey);
      document.getElementById('nickname-view').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  window.closeHistoryModal = () => document.getElementById('history-modal').style.display = 'none';

  window.toggleAddForm = () => {
    window.isEditMode = false;
    document.getElementById('add-form').style.display = 'block';
    document.getElementById('new-date').value = window.selectedDateKey || '';
    document.getElementById('new-nick').value = '';
    document.getElementById('new-id').value = '';
    document.getElementById('new-amount').value = '';
    document.getElementById('new-reverse').value = '';
    document.getElementById('new-content').value = '';
    document.getElementById('btn-submit').innerText = "등록 완료 💖";
  };

  // 🔥 [신규] 복제 기능 함수
  window.cloneCalendarTask = () => {
    const task = window.homeworkData[window.selectedDateKey][window.currentTaskIndex];
    window.isEditMode = false; // 복제는 새로운 등록이므로 에딧모드 해제
    
    document.getElementById('add-form').style.display = 'block';
    document.getElementById('new-date').value = window.selectedDateKey; // 현재 날짜 유지 (바꿀 수 있음)
    document.getElementById('new-nick').value = task.nick;
    document.getElementById('new-id').value = task.id;
    document.getElementById('new-amount').value = task.amount;
    document.getElementById('new-reverse').value = task.reverse;
    document.getElementById('new-content').value = task.content;
    
    // 비율 체크박스 세팅
    const ratio = (task.amount > 0) ? (task.reverse / task.amount) : 0.03;
    if(ratio >= 0.09) document.querySelector('input[name="calc-ratio"][value="0.10"]').checked = true;
    else if(ratio >= 0.04) document.querySelector('input[name="calc-ratio"][value="0.05"]').checked = true;
    else document.querySelector('input[name="calc-ratio"][value="0.03"]').checked = true;

    document.getElementById('btn-submit').innerText = "복제본 등록 💖";
    document.getElementById('detail-card').style.display = 'none';
    alert("복제 모드: 날짜와 내용을 수정한 후 [등록] 버튼을 누르세요.");
  };

  window.openEditForm = () => {
    window.isEditMode = true;
    const task = window.homeworkData[window.selectedDateKey][window.currentTaskIndex];
    document.getElementById('add-form').style.display = 'block';
    document.getElementById('new-date').value = window.selectedDateKey;
    document.getElementById('new-nick').value = task.nick;
    document.getElementById('new-id').value = task.id;
    document.getElementById('new-amount').value = task.amount;
    document.getElementById('new-reverse').value = task.reverse;
    document.getElementById('new-content').value = task.content;
    
    const ratio = (task.amount > 0) ? (task.reverse / task.amount) : 0.03;
    if(ratio >= 0.09) document.querySelector('input[name="calc-ratio"][value="0.10"]').checked = true;
    else if(ratio >= 0.04) document.querySelector('input[name="calc-ratio"][value="0.05"]').checked = true;
    else document.querySelector('input[name="calc-ratio"][value="0.03"]').checked = true;

    document.getElementById('btn-submit').innerText = "수정 완료 🔄";
    document.getElementById('detail-card').style.display = 'none';
  };

  window.autoCalculate = () => {
    const amt = document.getElementById('new-amount').value;
    const ratio = document.querySelector('input[name="calc-ratio"]:checked').value;
    document.getElementById('new-reverse').value = Math.floor(amt * ratio);
  };

  window.handleTaskSubmit = () => {
    const dKey = document.getElementById('new-date').value;
    if(!dKey) return alert("날짜 필수");
    const newTask = {
        nick: document.getElementById('new-nick').value,
        id: document.getElementById('new-id').value,
        amount: document.getElementById('new-amount').value,
        reverse: document.getElementById('new-reverse').value,
        content: document.getElementById('new-content').value,
        status: 'todo', memo: ''
    };

    if(window.isEditMode) {
        const oldTask = window.homeworkData[window.selectedDateKey][window.currentTaskIndex];
        newTask.status = oldTask.status;
        newTask.memo = oldTask.memo;
        if(dKey !== window.selectedDateKey) {
            window.homeworkData[window.selectedDateKey].splice(window.currentTaskIndex, 1);
            if(!window.homeworkData[dKey]) window.homeworkData[dKey] = [];
            window.homeworkData[dKey].push(newTask);
        } else {
            window.homeworkData[dKey][window.currentTaskIndex] = newTask;
        }
    } else {
        if(!window.homeworkData[dKey]) window.homeworkData[dKey] = [];
        window.homeworkData[dKey].push(newTask);
    }
    window.saveHomework();
    document.getElementById('add-form').style.display = 'none';
    window.selectDate(dKey);
  };

  window.showMemberDetail = (task, idx) => {
    window.currentTaskIndex = idx;
    document.getElementById('detail-card').style.display = 'block';
    document.getElementById('detail-nick').innerText = task.nick;
    document.getElementById('detail-id').innerText = `@${task.id}`;
    document.getElementById('detail-amount').innerText = parseInt(task.amount).toLocaleString();
    document.getElementById('detail-reverse').innerText = parseInt(task.reverse).toLocaleString();
    document.getElementById('detail-content').innerText = task.content;
    document.getElementById('detail-memo').value = task.memo || '';
    
    const radios = document.getElementsByName('status');
    let currentStatus = task.status || 'todo';
    if(currentStatus === 'partial') currentStatus = 'bangsel';
    for(let r of radios) { r.checked = (r.value === currentStatus); }
    
    document.getElementById('detail-link').href = `https://www.sooplive.co.kr/station/${task.id}`;
    document.getElementById('detail-note-link').href = `https://m.sooplive.co.kr/#/note/write2/${task.id}`;
  };

  window.saveTaskStatus = (showMsg=false) => {
    if(!window.selectedDateKey) return;
    const task = window.homeworkData[window.selectedDateKey][window.currentTaskIndex];
    task.memo = document.getElementById('detail-memo').value;
    const radios = document.getElementsByName('status');
    for(let r of radios) { if(r.checked) task.status = r.value; }
    window.saveHomework();
    window.renderNickList(window.homeworkData[window.selectedDateKey]);
  };

  window.completeAndDelete = () => { if(confirm("완료 처리하시겠습니까? (삭제)")) window.deleteTask(); };
  window.deleteTask = () => { window.homeworkData[window.selectedDateKey].splice(window.currentTaskIndex, 1); window.saveHomework(); window.closeDetail(); window.selectDate(window.selectedDateKey); };
  window.closeDetail = () => { document.getElementById('detail-card').style.display = 'none'; document.getElementById('add-form').style.display = 'none'; }

  // --- 시즌 기록실 로직 ---
  window.createNewSeason = () => {
    const name = prompt("새 시즌/회차 이름 (예: 1회차, 경쟁전)");
    if(!name || window.seasonData[name]) return;
    window.seasonData[name] = []; window.saveSeason(); window.switchSeasonTab(name);
  };

  window.renderSeasonTabs = () => {
    const container = document.getElementById('season-tabs-container'); container.innerHTML = '';
    const keys = Object.keys(window.seasonData).sort();
    if(keys.length === 0) { document.getElementById('season-content-area').style.display = 'none'; return; }
    keys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = `season-tab-btn ${key === window.currentSeasonName ? 'active' : ''}`;
        btn.innerText = key; btn.onclick = () => window.switchSeasonTab(key);
        container.appendChild(btn);
    });
  };

  window.switchSeasonTab = (name) => { window.currentSeasonName = name; renderSeasonTabs(); renderRecordTable(name); document.getElementById('season-content-area').style.display = 'block'; };

  window.renderRecordTable = (seasonName) => {
    document.getElementById('current-season-title').innerText = seasonName;
    const container = document.getElementById('record-data-rows'); container.innerHTML = '';
    const list = window.seasonData[seasonName] || [];
    let count = 0, totalNang = 0, totalReverse = 0;
    list.forEach((item, index) => {
        if(item.id || item.nick) count++;
        const amt = parseInt(item.amount || 0); totalNang += amt;
        const rev = parseInt(item.reverse || 0); totalReverse += rev;
        const bgColor = getLevelColor(amt);
        const row = document.createElement('div'); row.className = 'record-row data-row'; row.style.background = bgColor;
        row.innerHTML = `
            <div class="record-cell col-id" contenteditable="true" oninput="handleInput('${seasonName}', ${index}, 'id', this)" onblur="handleBlur()">${item.id || ''}</div>
            <div class="record-cell col-nick" contenteditable="true" oninput="handleInput('${seasonName}', ${index}, 'nick', this)" onblur="handleBlur()">${item.nick || ''}</div>
            <div class="record-cell col-amt amount-cell" contenteditable="true" oninput="handleInput('${seasonName}', ${index}, 'amount', this)" onblur="handleBlur()">${item.amount || ''}</div>
            <div class="record-cell col-promise" contenteditable="true" oninput="handleInput('${seasonName}', ${index}, 'promise', this)" onblur="handleBlur()">${item.promise || ''}</div>
            <div class="record-cell col-reverse reverse-cell" contenteditable="true" oninput="handleInput('${seasonName}', ${index}, 'reverse', this)" onblur="handleBlur()">${item.reverse || ''}</div>
            <div class="record-cell col-note" contenteditable="true" oninput="handleInput('${seasonName}', ${index}, 'note', this)" onblur="handleBlur()">${item.note || ''}</div>
            <div class="record-cell col-action"><div class="action-buttons"><button class="mini-btn" onclick="cloneRow(${index})">+</button><button class="mini-btn" onclick="removeRow(${index})">🗑</button></div></div>`;
        container.appendChild(row);
    });
    updateSumDisplay(count, totalNang, totalReverse);
  };

  function updateSumDisplay(cnt, nang, rev) {
      document.getElementById('sum-count').innerText = `${cnt}명`;
      document.getElementById('sum-nang').innerText = nang.toLocaleString();
      document.getElementById('sum-reverse').innerText = rev.toLocaleString();
  }

  window.handleInput = (seasonName, index, field, element) => {
    let val = element.innerText.trim();
    if(field === 'amount' || field === 'reverse') val = val.replace(/[^0-9]/g, ''); 
    window.seasonData[seasonName][index][field] = val;
    if(field === 'amount') element.closest('.record-row').style.background = getLevelColor(val);
    recalculateSums(seasonName);
  };

  window.handleBlur = () => window.saveSeason();

  function recalculateSums(seasonName) {
      let cnt = 0, nang = 0, rev = 0;
      window.seasonData[seasonName].forEach(item => { if(item.id || item.nick) cnt++; nang += parseInt(item.amount || 0); rev += parseInt(item.reverse || 0); });
      updateSumDisplay(cnt, nang, rev);
  }

  window.cloneRow = (index) => { const newItem = { id:'', nick:'', amount:'', promise:'', reverse:'', note:'' }; window.seasonData[window.currentSeasonName].splice(index + 1, 0, newItem); window.saveSeason(); renderRecordTable(window.currentSeasonName); };
  window.addEmptyRowAtEnd = () => { const newItem = { id:'', nick:'', amount:'', promise:'', reverse:'', note:'' }; window.seasonData[window.currentSeasonName].push(newItem); window.saveSeason(); renderRecordTable(window.currentSeasonName); };
  window.removeRow = (index) => { if(confirm("삭제하시겠습니까?")) { window.seasonData[window.currentSeasonName].splice(index, 1); window.saveSeason(); renderRecordTable(window.currentSeasonName); } };
  window.deleteCurrentSeason = () => { if(confirm("이 시즌을 완전히 삭제하시겠습니까?")) { delete window.seasonData[window.currentSeasonName]; window.currentSeasonName = null; window.saveSeason(); renderSeasonTabs(); } };
  window.filterRecords = () => { const q = document.getElementById('record-search').value.toLowerCase(); document.querySelectorAll('.data-row').forEach(row => row.style.display = row.innerText.toLowerCase().includes(q) ? 'flex' : 'none'); };

  document.addEventListener('paste', (e) => {
    if(!document.getElementById('page-record').classList.contains('active') || !window.currentSeasonName || e.target.isContentEditable) return;
    e.preventDefault(); const clipboardData = (e.clipboardData || window.clipboardData).getData('text'); if(!clipboardData) return;
    const rows = clipboardData.trim().split(/\r?\n/);
    if(confirm(`${rows.length}행을 붙여넣으시겠습니까?`)) {
        rows.forEach(rowStr => {
            const cols = rowStr.split('\t');
            window.seasonData[window.currentSeasonName].push({ id: cols[0]||'', nick: cols[1]||'', amount: (cols[2]||'').replace(/[^0-9]/g, ''), promise: cols[3]||'', reverse: (cols[4]||'').replace(/[^0-9]/g, ''), note: cols[5]||'' });
        });
        window.saveSeason(); renderRecordTable(window.currentSeasonName);
    }
  });

</script>

</body>
</html>
