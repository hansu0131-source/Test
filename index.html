*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#FFF7F8;
  font-family:'Pretendard', sans-serif;
  color:#444;
  padding:20px;
}

/* 전체 박스 */
.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:24px;
  background:white;
  border-radius:28px;
  box-shadow:
    0 10px 30px rgba(255,192,203,0.18);
}

/* 상단 이미지 */
.top-img{
  width:220px;
  display:block;
  margin:10px auto 24px;
}

/* 검색창 */
input[type="text"]{
  width:100%;
  padding:14px 18px;
  border:none;
  border-radius:999px;
  background:#FFF0F3;
  font-size:15px;
  outline:none;
  transition:0.2s;
  margin-bottom:22px;
}

input[type="text"]:focus{
  background:#ffe7ee;
}

/* 테이블 */
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px;
}

thead th{
  background:none;
  color:#ff7fa2;
  font-size:14px;
  padding:0 10px 6px;
  text-align:left;
  border:none;
  user-select:none;
  cursor:pointer;
}

/* 카드형 리스트 */
tbody tr{
  background:#FFF8FA;
  transition:0.15s;
  animation:fadeUp 0.25s ease;
}

tbody tr:hover{
  transform:translateY(-2px);
  background:#FFEFF4;
}

td{
  padding:16px 14px;
  border:none;
}

td:first-child{

  text-align:center;
  font-weight:700;
  color:#ff6b93;
  border-radius:16px 0 0 16px;
}

td:last-child{

.sig-name{

  font-size:15px;
}

/* NEW 배지 */
.new-badge{
  display:inline-block;
  margin-left:8px;
  background:#ff7a9e;
  color:white;
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  vertical-align:middle;
}

/* Re 배지 */
.re-badge{
  display:inline-block;
  margin-left:8px;
  background:#8bd8a5;
  color:white;
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  vertical-align:middle;
}

/* 검색결과 없음 */
.empty{
  padding:30px;
  text-align:center;
  color:#999;
  background:#FFF8FA;
  border-radius:18px;
}

/* 애니메이션 */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>

<script>

/* 요소 가져오기 */
const input = document.getElementById("search");
const tbody = document.getElementById("tbody");
const thNo = document.getElementById("thNo");

/* JSON 데이터 불러오기 */
const SIGS = JSON.parse(
  document.getElementById("data").textContent
);

/* 상태 */
let ascending = true;
let current = [...SIGS];

/* HTML 문자 보호 */
function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* 정렬 */
function sortInPlace(arr){
  arr.sort((a,b)=>
    ascending
      ? (a.no - b.no)
      : (b.no - a.no)
  );
}

/* 렌더링 */
function render(rows){

  if(!rows.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="2" class="empty">
          검색 결과 없음 🥺
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = rows.map((item)=>{

    const no = item.no;
    const name = item.name;

    const isNew = item.NEW === true;
    const isRe = item.Re === true;

    return `
      <tr>

        <td>${no}</td>

        <td class="sig-name">

          ${escapeHtml(name)}

          ${isNew
            ? '<span class="new-badge">NEW</span>'
            : ''
          }

          ${isRe
            ? '<span class="re-badge">✓ Re</span>'
            : ''
          }

        </td>

      </tr>
    `;

  }).join("");

}

/* 검색 */
function applySearch(){

  const q = input.value
    .toLowerCase()
    .trim();

  current = SIGS.filter(({no,name})=>

    String(no).includes(q) ||

    String(name)
      .toLowerCase()
      .includes(q)

  );

  sortInPlace(current);

  render(current);
}

/* 정렬 토글 */
function toggleSort(){

  ascending = !ascending;

  thNo.textContent =
    ascending
      ? "번호 ▲"
      : "번호 ▼";

  sortInPlace(current);

  render(current);
}

/* 이벤트 */
input.addEventListener(
  "keyup",
  applySearch
);

thNo.addEventListener(
  "click",
  toggleSort
);

/* 초기 실행 */
sortInPlace(current);
render(current);

</script>
